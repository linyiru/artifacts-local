name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is where the flaky EPIPE of #2 was reported.
        node: [24, 25]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git --version && ls "$(git --exec-path)/git-http-backend"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: dist/ is up to date
        run: |
          npm run build
          git diff --exit-code -- dist || { echo "::error::dist/ is stale; run npm run build and commit it"; exit 1; }
      - run: npm run test:coverage

  e2e:
    name: wrangler dev end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
